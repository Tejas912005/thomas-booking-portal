# Integration test datasource — mirrors the main application configuration.
# Override at runtime via environment variables: DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the same JPA / Flyway settings as production so the schema is identical
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Reduce noise in test logs
logging.level.org.springframework=WARN
logging.level.com.thomascook=DEBUG
